name: Terraform Targeted Destroy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Terraform resource to destroy"
        required: true
        type: string

jobs:
  destroy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform inin
