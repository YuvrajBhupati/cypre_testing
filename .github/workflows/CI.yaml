name: Build and Push Backend & Frontend Images

on:
  push:
    branches:
      - s3-deploy

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: [ubuntu-latest]
    # container:
    #   image: summerwind/actions-runner:latest
      
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

    
      # - name: Setup tools (awscli, kubectl, helm)
      #   run: |
      #     sudo apt-get install -y unzip zip curl

      #     curl -sS https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o aws.zip \
      #     && unzip -q aws.zip && sudo ./aws/install --update

      #     curl -sSL https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl -o kubectl \
      #     && chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          
      #     curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      #     echo "✅ Verify installs"
      #     aws --version
      #     kubectl version --client
      #     helm version

      - name: Deploy Helm charts
        shell: bash
        run: |
          if [ -d "helm" ] && find helm -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "Helm charts found. Deploying..."

            for chart in helm/*; do
              if [ -d "$chart" ]; then
                name=$(basename "$chart")
                echo "Deploying Helm chart: $name"

                helm upgrade --install "$name" "$chart" \
                --namespace "${NAMESPACE}" \
                --create-namespace
              fi
           done
          else
            echo "No Helm charts found. Skipping..."
          fi

      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          if [ -d "kubernetes" ] && find kubernetes -type f \( -name "*.yaml" -o -name "*.yml" \) | grep -q .; then
            echo "Kubernetes manifests found. Applying..."
            kubectl apply -f kubernetes/
          else
            echo "No Kubernetes manifests found. Skipping..."
          fi

      - name: Docker build (only if dockerfile/ changed)
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^dockerfile/'; then
            echo "dockerfile/ changed → building image"
            docker build -f dockerfile/Dockerfile -t test:latest .
          else
            echo "No dockerfile/ changes → skipping docker build"
          fi
