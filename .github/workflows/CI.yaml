name: List S3 Bucket

on:
  workflow_dispatch:   

permissions:
  id-token: write      
  contents: read

jobs:
  list-s3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::795488789172:role/github-action-role
          aws-region: ap-south-1   # Change to your region

      - name: List S3 bucket
        run: |
          aws s3 ls